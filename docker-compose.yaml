version: "3.9"

services:
  web:
    build: .
    container_name: calleatmandu_web
    command: daphne -b 0.0.0.0 -p 8000 calleatmandu.asgi:application
    ports:
      - "8000:8000"
    volumes:
      - calleatmandu_media_data:/app/media   # Persist media uploads
    networks:
      - coolify

networks:
  coolify:
    external: true

volumes:
  calleatmandu_media_data:
